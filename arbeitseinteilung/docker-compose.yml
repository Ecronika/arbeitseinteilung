version: '3.8'

services:
  arbeitseinteilung:
    build: .
    container_name: arbeitseinteilung
    ports:
      - "8090:8090"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - DATABASE_PATH=/app/data/arbeitseinteilung.db
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/api/health')\" || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
