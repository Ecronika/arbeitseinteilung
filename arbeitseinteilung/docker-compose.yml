version: '3.8'

services:
  arbeitseinteilung:
    build: .
    container_name: arbeitseinteilung
    ports:
      - "8090:8090"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - DATABASE_PATH=/app/data/arbeitseinteilung.db
      - SECRET_KEY=ERSETZE_MICH_MIT_ZUFALLSWERT
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8090/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
