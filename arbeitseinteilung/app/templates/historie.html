{% extends "base.html" %}
{% block title %}Änderungshistorie – Arbeitseinteilung{% endblock %}

{% block content %}
<div class="page-wrap">
    <div class="page-header">
        <div class="page-title">Änderungshistorie</div>
    </div>

    <div class="section-card" style="padding:16px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-end">
        <div class="form-group" style="min-width:200px">
            <label class="form-label">Bearbeiter</label>
            <input class="form-input" id="filterBearbeiter" placeholder="Name...">
        </div>
        <div class="form-group" style="min-width:200px">
            <label class="form-label">Mitarbeiter</label>
            <select class="form-select" id="filterMitarbeiter">
                <option value="">– alle –</option>
            </select>
        </div>
        <div class="form-group" style="min-width:140px">
            <label class="form-label">Von</label>
            <input type="date" class="form-input" id="filterVon">
        </div>
        <div class="form-group" style="min-width:140px">
            <label class="form-label">Bis</label>
            <input type="date" class="form-input" id="filterBis">
        </div>
        <button class="btn btn-primary" onclick="loadHistorie()">Suchen</button>
    </div>

    <div class="section-card">
        <table class="data-table" id="historieTabelle">
            <thead>
                <tr>
                    <th>Zeitstempel</th>
                    <th>Bearbeiter</th>
                    <th>Mitarbeiter</th>
                    <th>Datum</th>
                    <th>Vorher</th>
                    <th>Nachher</th>
                </tr>
            </thead>
            <tbody id="historieTbody">
                <tr>
                    <td colspan="6" style="text-align:center;color:var(--muted);padding:20px">Lade...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const res = await fetch('/api/mitarbeiter');
        const data = await res.json();
        const sel = document.getElementById('filterMitarbeiter');
        (data.alle || []).forEach(m => {
            const o = document.createElement('option');
            o.value = m.id;
            o.textContent = m.name;
            sel.appendChild(o);
        });
        loadHistorie();
    });

    async function loadHistorie() {
        const bearbeiter = document.getElementById('filterBearbeiter').value.trim();
        const mid = document.getElementById('filterMitarbeiter').value;
        const von = document.getElementById('filterVon').value;
        const bis = document.getElementById('filterBis').value;

        let url = '/api/historie?limit=300';
        if (bearbeiter) url += `&bearbeiter=${encodeURIComponent(bearbeiter)}`;
        if (mid) url += `&mitarbeiter_id=${mid}`;
        if (von) url += `&von=${von}`;
        if (bis) url += `&bis=${bis}`;

        let data;
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            data = await res.json();
        } catch (e) {
            document.getElementById('historieTbody').innerHTML =
                '<tr><td colspan="6" style="text-align:center;color:#c62828;padding:20px">⚠ Daten konnten nicht geladen werden</td></tr>';
            return;
        }

        const tbody = document.getElementById('historieTbody');
        if (!data.length) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px">Keine Einträge gefunden</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(h => `<tr>
        <td style="font-family:var(--font-mono);font-size:12px;white-space:nowrap">${h.zeitstempel ? h.zeitstempel.replace('T', ' ').slice(0, 16) : ''}</td>
        <td><strong>${escapeHtml(h.bearbeiter_name || '–')}</strong><br><span style="font-size:11px;color:var(--muted)">${escapeHtml(h.bearbeiter_ip || '')}</span></td>
        <td>${escapeHtml(h.mitarbeiter_name || '')}</td>
        <td style="font-family:var(--font-mono)">${h.datum || ''}</td>
        <td style="color:#c62828;font-size:12px">${escapeHtml(h.wert_vorher || '–')}</td>
        <td style="color:#2E7D32;font-size:12px;font-weight:600">${escapeHtml(h.wert_nachher || '–')}</td>
    </tr>`).join('');
    }
</script>
{% endblock %}
