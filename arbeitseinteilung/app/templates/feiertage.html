{% extends "base.html" %}
{% block title %}Feiertage – Arbeitseinteilung{% endblock %}

{% block content %}
<div class="page-wrap">
    <div class="page-header">
        <div class="page-title">Feiertage & Betriebskalender</div>
        <div style="display:flex;gap:10px">
            <select class="form-select" id="yearSelect" onchange="loadFeiertage()" style="width:100px"></select>
            <button class="btn btn-ghost" onclick="generiereFeiertage()">⟳ HH-Feiertage generieren</button>
            <button class="btn btn-primary" onclick="openFeiertagForm()">+ Eintrag hinzufügen</button>
        </div>
    </div>
    <div id="feiertagTabelle"></div>
</div>

<div id="ftModal" class="modal-overlay" style="display:none">
    <div class="modal" style="width:380px" role="dialog" aria-modal="true" aria-labelledby="ftModalTitle">
        <h2 id="ftModalTitle">Eintrag hinzufügen</h2><br>
        <form class="form-grid" onsubmit="event.preventDefault(); saveFeiertag();">
            <div class="form-group">
                <label class="form-label" for="ftDatum">Datum *</label>
                <input class="form-input" type="date" id="ftDatum">
            </div>
            <div class="form-group">
                <label class="form-label" for="ftBezeichnung">Bezeichnung *</label>
                <input class="form-input" id="ftBezeichnung" placeholder="z.B. Betriebsferien">
            </div>
        </form>
        <br>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="closeFtModal()">Abbrechen</button>
            <button class="btn btn-primary" onclick="saveFeiertag()">Hinzufügen</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let ftData = [];
    document.addEventListener('DOMContentLoaded', () => {
        const sel = document.getElementById('yearSelect');
        const currentYear = new Date().getFullYear();
        for (let y = currentYear - 1; y <= currentYear + 2; y++) {
            const o = document.createElement('option');
            o.value = y;
            o.textContent = y;
            if (y === currentYear) o.selected = true;
            sel.appendChild(o);
        }
        loadFeiertage();
    });

    async function loadFeiertage() {
        const year = document.getElementById('yearSelect').value;
        try {
            const res = await fetch(`/api/feiertage?year=${year}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            ftData = await res.json();
            renderFtTabelle();
        } catch (e) {
            showToast('Feiertage konnten nicht geladen werden', 'error');
            console.error(e);
        }
    }

    function renderFtTabelle() {
        const html = `<div class="section-card">
        <table class="data-table">
            <thead><tr><th>Datum</th><th>Wochentag</th><th>Bezeichnung</th><th>Typ</th><th></th></tr></thead>
            <tbody>
                ${ftData.map(f => {
            const d = new Date(f.datum + 'T00:00:00');
            const tage = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
            return `<tr>
                        <td style="font-family:var(--font-mono)">${f.datum}</td>
                        <td>${tage[d.getDay()]}</td>
                        <td><strong>${escapeHtml(f.bezeichnung)}</strong></td>
                        <td><span class="badge" style="background:${f.automatisch ? '#e8f5e9' : '#fff3e0'};color:${f.automatisch ? '#2E7D32' : '#E65100'}">${f.automatisch ? 'Automatisch' : 'Manuell'}</span></td>
                        <td><button class="btn btn-danger" style="padding:3px 10px;font-size:11px" onclick="deleteFeiertag(${f.id})">Löschen</button></td>
                    </tr>`;
        }).join('')}
            </tbody>
        </table>
    </div>`;
        document.getElementById('feiertagTabelle').innerHTML = ftData.length ? html : '<p style="color:var(--muted);padding:20px">Keine Einträge für dieses Jahr.</p>';
    }

    async function generiereFeiertage() {
        const year = document.getElementById('yearSelect').value;
        const res = await fetch('/api/feiertage/generieren', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ year: parseInt(year) })
        });
        const data = await res.json();
        loadFeiertage();
        showToast(`${data.count} Feiertage generiert`, 'success');
    }

    function openFeiertagForm() {
        lastFocusedElement = document.activeElement;
        document.getElementById('ftDatum').value = '';
        document.getElementById('ftBezeichnung').value = '';
        document.getElementById('ftModal').style.display = 'flex';
        setTimeout(() => document.getElementById('ftDatum').focus(), 50);
    }
    function closeFtModal() {
        document.getElementById('ftModal').style.display = 'none';
        if (lastFocusedElement) lastFocusedElement.focus();
    }

    async function saveFeiertag() {
        const datum = document.getElementById('ftDatum').value;
        const bez = document.getElementById('ftBezeichnung').value.trim();
        if (!datum || !bez) { showToast('Datum und Bezeichnung erforderlich', 'error'); return; }

        const btnSave = document.querySelector('#ftModal .btn-primary');
        if (btnSave) btnSave.disabled = true;

        try {
            const res = await fetch('/api/feiertage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ datum, bezeichnung: bez })
            });
            if (!res.ok) throw new Error('API Error');
            closeFtModal();
            loadFeiertage();
            showToast('Eintrag hinzugefügt', 'success');
        } catch (e) {
            showToast('Fehler beim Speichern', 'error');
            console.error(e);
        } finally {
            if (btnSave) btnSave.disabled = false;
        }
    }

    async function deleteFeiertag(id) {
        if (!confirm('Eintrag löschen?')) return;
        try {
            const res = await fetch(`/api/feiertage/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('API Error');
            loadFeiertage();
            showToast('Gelöscht', 'success');
        } catch (e) {
            showToast('Fehler beim Löschen', 'error');
        }
    }
</script>
{% endblock %}
