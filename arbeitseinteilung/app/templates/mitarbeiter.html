{% extends "base.html" %}
{% block title %}Mitarbeiter – Arbeitseinteilung{% endblock %}

{% block content %}
<div class="page-wrap">
    <div class="page-header">
        <div class="page-title">Mitarbeiterverwaltung</div>
        <button class="btn btn-primary" onclick="openMitarbeiterForm()">+ Mitarbeiter anlegen</button>
    </div>

    <div id="mitarbeiterTabelle"></div>
</div>

<!-- Formular Modal -->
<div id="maModal" class="modal-overlay" style="display:none">
    <div class="modal" style="width:520px;max-width:95vw" role="dialog" aria-modal="true"
        aria-labelledby="maModalTitle">
        <h2 id="maModalTitle">Mitarbeiter anlegen</h2>
        <br>
        <div class="form-grid">
            <input type="hidden" id="maId">
            <div class="form-group">
                <label class="form-label">Name *</label>
                <input class="form-input" id="maName" placeholder="Vor- und Nachname">
            </div>
            <div class="form-group">
                <label class="form-label">Personalnummer</label>
                <input class="form-input" id="maPnr" placeholder="z.B. 1041">
            </div>
            <div class="form-group">
                <label class="form-label">Gruppe</label>
                <select class="form-select" id="maGruppe">
                    {% for g in gruppen %}
                    <option value="{{ g }}">{{ g }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Typ</label>
                <select class="form-select" id="maTyp" onchange="onTypChange()">
                    <option value="Monteur">Monteur</option>
                    <option value="Azubi">Azubi</option>
                    <option value="Leiharbeiter">Leiharbeiter</option>
                    <option value="Praktikant">Praktikant</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Führerschein</label>
                <select class="form-select" id="maFuehrerschein">
                    <option value="0">Nein</option>
                    <option value="1">Ja</option>
                </select>
            </div>
            <div class="form-group" id="azubiBlockWrap" style="display:none">
                <label class="form-label">Schulblock (Azubi)</label>
                <select class="form-select" id="maAzubiBlock">
                    <option value="">–</option>
                    <option value="A">Block A</option>
                    <option value="B">Block B</option>
                    <option value="C">Block C</option>
                </select>
            </div>
            <div class="form-group" id="betreuerWrap" style="display:none">
                <label class="form-label">Betreuer (Stammmonteur)</label>
                <select class="form-select" id="maBetreuer">
                    <option value="">– kein –</option>
                </select>
            </div>
            <div class="form-group full" id="verleihWrap" style="display:none">
                <label class="form-label">Verleihfirma</label>
                <input class="form-input" id="maVerleihfirma" placeholder="z.B. Tempton, Manpower...">
            </div>
            <div class="form-group" id="einsatzVonWrap" style="display:none">
                <label class="form-label">Einsatz von</label>
                <input class="form-input" type="date" id="maEinsatzVon">
            </div>
            <div class="form-group" id="einsatzBisWrap" style="display:none">
                <label class="form-label">Einsatz bis</label>
                <input class="form-input" type="date" id="maEinsatzBis">
            </div>
        </div>
        <br>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="closeMaModal()">Abbrechen</button>
            <button class="btn btn-primary" onclick="saveMitarbeiter()">Speichern</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let maData = [];

    document.addEventListener('DOMContentLoaded', () => {
        loadMaTabelle();

        // Event Delegation für Tabellen-Buttons
        document.getElementById('mitarbeiterTabelle').addEventListener('click', e => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const id = parseInt(btn.dataset.id);
            if (btn.dataset.action === 'edit') editMitarbeiter(id);
            if (btn.dataset.action === 'deactivate') deaktiviereMitarbeiter(id, btn.dataset.name);
        });
    });

    async function loadMaTabelle() {
        try {
            const res = await fetch('/api/mitarbeiter');
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            maData = data.alle || [];
            renderMaTabelle(data.gruppen || {});
        } catch (e) {
            showToast('Mitarbeiter konnten nicht geladen werden', 'error');
            console.error(e);
            return;
        }
        // Betreuer-Dropdown befüllen
        const sel = document.getElementById('maBetreuer');
        // Bestehende Optionen (außer dem ersten "– kein –") entfernen
        while (sel.options.length > 1) sel.remove(1);
        maData.filter(m => m.typ === 'Monteur').forEach(m => {
            const o = document.createElement('option');
            o.value = m.id;
            o.textContent = m.name;
            sel.appendChild(o);
        });
    }

    function renderMaTabelle(gruppen) {
        const GRUPPEN = ['KD', 'ST', 'KDF', 'MT', 'P1', 'P2', 'Büro'];
        let html = '';
        GRUPPEN.forEach(g => {
            const members = gruppen[g];
            if (!members || members.length === 0) return;
            html += `<div class="section-card">
            <div class="section-card-header" style="background:${getGruppeFarbe(g)};color:white">
                ${g} – ${members.length} Mitarbeiter
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Name</th><th>P.Nr</th><th>Typ</th>
                        <th>Fahrzeug</th><th>Führerschein</th><th>Info</th><th>Aktionen</th>
                    </tr>
                </thead>
                <tbody>
                    ${members.map(m => `
                    <tr>
                        <td><strong>${escapeHtml(m.name)}</strong></td>
                        <td style="font-family:var(--font-mono)">${escapeHtml(m.personalnummer || '–')}</td>
                        <td><span class="badge badge-${g.toLowerCase()}">${escapeHtml(m.typ)}</span></td>
                        <td style="font-family:var(--font-mono);font-size:12px">${m.kennzeichen ? escapeHtml(m.kennzeichen) + (m.baujahr ? ' · ' + escapeHtml(m.baujahr) + '/' + escapeHtml(m.kraftstoff) : '') : '–'}</td>
                        <td>${m.fuehrerschein ? '✓' : '–'}</td>
                        <td style="font-size:12px;color:var(--muted)">
                            ${m.azubi_block ? 'Block ' + escapeHtml(m.azubi_block) : ''}
                            ${m.betreuer_name ? 'bei ' + escapeHtml(m.betreuer_name) : ''}
                            ${m.verleihfirma ? escapeHtml(m.verleihfirma) : ''}
                        </td>
                        <td>
                            <button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" data-action="edit" data-id="${m.id}">Bearbeiten</button>
                            <button class="btn btn-danger" style="padding:4px 10px;font-size:12px" data-action="deactivate" data-id="${m.id}" data-name="${escapeHtml(m.name)}">Deaktivieren</button>
                        </td>
                    </tr>`).join('')}
                </tbody>
            </table>
        </div>`;
        });
        document.getElementById('mitarbeiterTabelle').innerHTML = html || '<p style="color:var(--muted);padding:20px">Noch keine Mitarbeiter angelegt.</p>';
    }

    function getGruppeFarbe(g) {
        const f = { 'KD': '#1565C0', 'ST': '#2E7D32', 'KDF': '#6A1B9A', 'MT': '#E65100', 'P1': '#00695C', 'P2': '#558B2F', 'Büro': '#4E342E' };
        return f[g] || '#555';
    }

    function onTypChange() {
        const typ = document.getElementById('maTyp').value;
        document.getElementById('azubiBlockWrap').style.display = (typ === 'Azubi') ? 'block' : 'none';
        document.getElementById('betreuerWrap').style.display = (typ === 'Azubi' || typ === 'Praktikant') ? 'block' : 'none';
        document.getElementById('verleihWrap').style.display = (typ === 'Leiharbeiter') ? 'block' : 'none';
        document.getElementById('einsatzVonWrap').style.display = (typ === 'Leiharbeiter') ? 'block' : 'none';
        document.getElementById('einsatzBisWrap').style.display = (typ === 'Leiharbeiter') ? 'block' : 'none';
    }

    function openMitarbeiterForm(ma = null) {
        document.getElementById('maId').value = ma ? ma.id : '';
        document.getElementById('maName').value = ma ? ma.name : '';
        document.getElementById('maPnr').value = ma ? (ma.personalnummer || '') : '';
        document.getElementById('maGruppe').value = ma ? ma.gruppe : 'KD';
        document.getElementById('maTyp').value = ma ? ma.typ : 'Monteur';
        document.getElementById('maFuehrerschein').value = ma ? (ma.fuehrerschein ? '1' : '0') : '0';
        document.getElementById('maAzubiBlock').value = ma ? (ma.azubi_block || '') : '';
        document.getElementById('maBetreuer').value = ma ? (ma.betreuer_id || '') : '';
        document.getElementById('maVerleihfirma').value = ma ? (ma.verleihfirma || '') : '';
        document.getElementById('maEinsatzVon').value = ma ? (ma.einsatz_von || '') : '';
        document.getElementById('maEinsatzBis').value = ma ? (ma.einsatz_bis || '') : '';
        document.getElementById('maModalTitle').textContent = ma ? 'Mitarbeiter bearbeiten' : 'Mitarbeiter anlegen';
        onTypChange();
        document.getElementById('maModal').style.display = 'flex';
    }

    function editMitarbeiter(id) {
        const ma = maData.find(m => m.id === id);
        if (ma) openMitarbeiterForm(ma);
    }

    function closeMaModal() {
        document.getElementById('maModal').style.display = 'none';
    }

    async function saveMitarbeiter() {
        const id = document.getElementById('maId').value;
        const payload = {
            name: document.getElementById('maName').value.trim(),
            personalnummer: document.getElementById('maPnr').value.trim(),
            gruppe: document.getElementById('maGruppe').value,
            typ: document.getElementById('maTyp').value,
            fuehrerschein: document.getElementById('maFuehrerschein').value === '1',
            azubi_block: document.getElementById('maAzubiBlock').value || null,
            betreuer_id: document.getElementById('maBetreuer').value || null,
            verleihfirma: document.getElementById('maVerleihfirma').value.trim() || null,
            einsatz_von: document.getElementById('maEinsatzVon').value || null,
            einsatz_bis: document.getElementById('maEinsatzBis').value || null,
            aktiv: true
        };
        if (!payload.name) { alert('Name ist erforderlich'); return; }
        const url = id ? `/api/mitarbeiter/${id}` : '/api/mitarbeiter';
        const method = id ? 'PUT' : 'POST';
        try {
            const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!res.ok) throw new Error('API Error');
            closeMaModal();
            loadMaTabelle();
            showToast(id ? 'Aktualisiert' : 'Mitarbeiter angelegt', 'success');
        } catch (e) {
            showToast('Fehler beim Speichern', 'error');
        }
    }

    async function deaktiviereMitarbeiter(id, name) {
        if (!confirm(`${name} wirklich deaktivieren? Die Person verschwindet aus dem Kalender, Historik bleibt erhalten.`)) return;
        try {
            const res = await fetch(`/api/mitarbeiter/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('API Error');
            loadMaTabelle();
            showToast(`${name} deaktiviert`, 'success');
        } catch (e) {
            showToast('Fehler beim Deaktivieren', 'error');
        }
    }
</script>
{% endblock %}
